<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relatório de Formulários</title>
    <link rel="stylesheet" href="report.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Form Test Auditor</p>
        <h1>Relatório de Formulários</h1>
        <p id="subtitle">Carregando auditoria...</p>
      </div>
      <div class="actions">
        <button id="downloadJson" type="button">Baixar JSON</button>
        <button id="printReport" type="button">Imprimir</button>
      </div>
    </header>

    <main class="layout">
      <section class="summary" aria-label="Resumo da auditoria">
        <article><strong id="pages">0</strong><span>Páginas analisadas</span></article>
        <article><strong id="forms">0</strong><span>Formulários</span></article>
        <article><strong id="fields">0</strong><span>Campos</span></article>
        <article><strong id="failed">0</strong><span>Testes com falha</span></article>
        <article><strong id="hidden">0</strong><span>Itens ocultos</span></article>
      </section>

      <section class="section dashboard">
        <div class="sectionHeader">
          <h2>Resumo Visual</h2>
          <span id="statusBadge" class="badge">Pronto</span>
        </div>
        <div class="visualGrid">
          <div class="chartPanel">
            <h3>Resultado dos testes</h3>
            <div id="testChart" class="donut" aria-label="Gráfico de testes"></div>
            <p id="testChartLabel" class="chartLabel">0 testes</p>
          </div>
          <div class="chartPanel">
            <h3>Distribuição por página</h3>
            <div id="pageBars" class="bars"></div>
          </div>
          <div id="overview" class="overview"></div>
        </div>
      </section>

      <section class="section">
        <div class="sectionHeader">
          <h2>Lista de páginas</h2>
          <span id="resultCount" class="resultCount">0 resultados</span>
        </div>
        <div class="filters" aria-label="Filtros da tabela">
          <input id="filter" type="search" placeholder="Filtrar por URL, campo ou erro">
          <select id="statusFilter" aria-label="Filtrar por status">
            <option value="all">Todos os status</option>
            <option value="failed">Com falhas</option>
            <option value="passed">Sem falhas</option>
          </select>
          <select id="frameworkFilter" aria-label="Filtrar por framework">
            <option value="all">Todos os frameworks</option>
          </select>
          <select id="hiddenFilter" aria-label="Filtrar itens ocultos">
            <option value="all">Todos ocultos</option>
            <option value="withHidden">Com ocultos</option>
            <option value="withoutHidden">Sem ocultos</option>
          </select>
          <button id="clearFilters" type="button">Limpar</button>
        </div>
        <div class="tableWrap">
          <table class="pagesTable">
            <thead>
              <tr>
                <th><button type="button" data-sort="title">Página</button></th>
                <th><button type="button" data-sort="forms">Forms</button></th>
                <th><button type="button" data-sort="fields">Campos</button></th>
                <th><button type="button" data-sort="failures">Falhas</button></th>
                <th><button type="button" data-sort="hidden">Ocultos</button></th>
                <th><button type="button" data-sort="frameworks">Frameworks</button></th>
                <th>Detalhes</th>
              </tr>
            </thead>
            <tbody id="pagesList"></tbody>
          </table>
        </div>
      </section>

      <section class="section">
        <div class="sectionHeader">
          <h2>Erros de Rastreamento</h2>
        </div>
        <div id="errors" class="errors"></div>
      </section>
    </main>

    <script src="report.js" type="module"></script>
  </body>
</html>
